# Jumpstart — Nginx site config for the VPS deployment.
#
# Install:
#   sudo cp deploy/nginx/jumpstart.conf /etc/nginx/sites-available/jumpstart
#   sudo ln -s /etc/nginx/sites-available/jumpstart /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Serves the built SPA from disk and reverse-proxies /api to the Node
# process managed by systemd (deploy/systemd/jumpstart-api.service).
#
# See docs/VPS_DEPLOYMENT.md for the full runbook, including the Brotli
# module install and the Cloudflare settings that pair with this file.

# --- Brotli --------------------------------------------------------------
# Requires ngx_brotli. On Ubuntu 22.04+/Debian 12 the packaged module is
# libnginx-mod-brotli; it must be load_module'd from nginx.conf, not here.
# If the module is unavailable, delete this block — gzip below still
# applies and the site works, just ~15-20% larger on text assets.
brotli              on;
brotli_comp_level   5;   # 5 is the knee of the curve; 11 costs CPU for ~2%
brotli_min_length   256;
brotli_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/rss+xml application/wasm
    image/svg+xml font/ttf font/otf;

# --- gzip (fallback for clients that do not advertise br) ---------------
gzip                on;
gzip_vary           on;   # critical: without it caches can serve the
                          # wrong encoding to the wrong client
gzip_proxied        any;
gzip_comp_level     6;
gzip_min_length     256;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/rss+xml application/wasm
    image/svg+xml font/ttf font/otf;

# Vite already emits .gz siblings at build time (vite-plugin-compression).
# gzip_static serves those precompressed files instead of compressing on
# every request — lower CPU and a better ratio, since build-time
# compression can afford maximum effort.
gzip_static         on;

upstream jumpstart_api {
    # keepalive holds connections open to the Node process so each API
    # request does not pay for a fresh TCP handshake. This is a direct
    # TTFB saving on every authenticated call.
    server 127.0.0.1:5000;
    keepalive 32;
}

# --- HTTP -> HTTPS -------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name jumpstartedu.com www.jumpstartedu.com;

    # Certbot writes its challenge here; everything else is redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 as its own directive (Nginx 1.25.1+). On older builds use
    # `listen 443 ssl http2;` instead.
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;

    # HTTP/3 / QUIC. Requires Nginx built with the quic module and UDP
    # 443 open in the firewall. Comment out both lines if unavailable —
    # HTTP/2 above is what carries the traffic either way.
    listen      443 quic reuseport;
    listen      [::]:443 quic reuseport;

    server_name jumpstartedu.com www.jumpstartedu.com;

    root  /var/www/jumpstart/dist;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/jumpstartedu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jumpstartedu.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # TLS 1.3 0-RTT: lets a returning client send its request in the
    # first flight instead of waiting a full round trip. Safe here
    # because the replay window only ever contains idempotent GETs — the
    # API is proxied below and Express rejects replayed mutations on
    # its own via CSRF/JWT checks.
    ssl_early_data on;

    # Advertise HTTP/3 to clients that arrived over HTTP/2.
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # --- Security headers ------------------------------------------------
    add_header X-Content-Type-Options nosniff        always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN            always;

    # HSTS. Only enable after confirming HTTPS works on every subdomain —
    # it is not practically reversible within max-age.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- API proxy -------------------------------------------------------
    location /api/ {
        proxy_pass         http://jumpstart_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";          # required for keepalive
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Express already gzips these (see server.js). Re-compressing
        # would waste CPU for nothing.
        gzip off;

        # Report generation and the 500-question package fetch are the
        # slowest endpoints; the default 60s is enough but the read
        # timeout is called out here so it is a deliberate number.
        proxy_read_timeout 60s;

        # API responses must never be cached at the edge — they are
        # per-user and auth-dependent.
        add_header Cache-Control "no-store" always;
    }

    # --- Static assets ---------------------------------------------------
    # Vite content-hashes everything under /assets, so the filename
    # changes whenever the bytes change. That makes a one-year immutable
    # cache correct rather than merely aggressive: a stale entry is
    # unreachable, because a new build produces a new URL.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Fonts are NOT content-hashed (they live in public/ at stable paths
    # so index.html can preload them by name), so they get a long — but
    # not immutable — TTL. Re-running `npm run fonts:fetch` changes the
    # filename via the weight-range suffix, and a stale font is a cosmetic
    # problem for at most 30 days rather than a broken page.
    #
    # crossorigin fonts need CORS headers even same-origin.
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Access-Control-Allow-Origin "*" always;
        access_log off;
        try_files $uri =404;
    }

    # Question media is content-addressed by question id and only ever
    # appended to, never rewritten in place.
    location /question-media/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --- SPA fallback ----------------------------------------------------
    # index.html must NOT be cached: it is the file that names the current
    # hashed bundles. Caching it is how users end up pinned to a deleted
    # build after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
